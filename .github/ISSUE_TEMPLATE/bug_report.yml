name: Bug report
description: Report a reproducible problem in eMule Next
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test eMule Next. Remove personal data, IP addresses, paths, search terms and shared-file names before submitting.
  - type: input
    id: version
    attributes:
      label: eMule Next version
      description: Copy the complete version shown by the client or package name.
      placeholder: 1.0.0-alpha.1
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Win32
        - x64
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package type
      options:
        - Normal profile
        - Portable ZIP
        - Self-built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the malfunction and when it started.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostic information
      description: Paste only reviewed log excerpts or sanitized screenshots. Do not upload configuration files or crash dumps publicly.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed personal data, credentials, file names, search terms and IP addresses.
          required: true
        - label: I am not uploading copyrighted content, private configuration files or a crash dump.
          required: true
