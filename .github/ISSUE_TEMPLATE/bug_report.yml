name: Bug report
description: Report a reproducible problem in eMule Next
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test eMule Next. Remove personal data, IP addresses, paths, search terms and shared-file names before submitting.
  - type: input
    id: version
    attributes:
      label: eMule Next version
      description: Copy the complete version shown by the client or package name.
      placeholder: 1.0.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Win32
        - x64
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package type
      options:
        - Normal profile
        - Portable ZIP
        - Self-built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        For connection problems, complete the optional fields below. For other bugs, leave them as "Not applicable". Do not include your public IP address, router serial number, passwords or screenshots of router settings.
  - type: input
    id: router
    attributes:
      label: Router brand and model (connection problems only)
      description: If known; do not include a serial number or login details.
      placeholder: Example: FRITZ!Box 7590
    validations:
      required: false
  - type: dropdown
    id: port_setup
    attributes:
      label: How are the router ports opened?
      options:
        - Not applicable
        - I don't know
        - Manual port forwarding
        - UPnP
        - NAT-PMP
        - PCP
        - No port opening configured
    validations:
      required: false
  - type: dropdown
    id: ed2k_result
    attributes:
      label: eD2K result
      description: Check the eD2K status in eMule Next; do not paste your IP address.
      options:
        - Not applicable
        - I don't know
        - Not connected
        - Connected, High ID
        - Connected, Low ID
    validations:
      required: false
  - type: dropdown
    id: kad_result
    attributes:
      label: Kad result
      description: Report Kad separately from eD2K.
      options:
        - Not applicable
        - I don't know
        - Not connected
        - Connected, open
        - Connected, firewalled
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the malfunction and when it started.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Additional diagnostic information
      description: Paste only reviewed log excerpts or sanitized screenshots. Do not upload configuration files or crash dumps publicly.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed personal data, credentials, file names, search terms and IP addresses.
          required: true
        - label: I am not uploading copyrighted content, private configuration files or a crash dump.
          required: true
